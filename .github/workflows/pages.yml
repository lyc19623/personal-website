name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: '0.169.0'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
      - name: Install Hugo
        run: |
          archive="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/$archive"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" hugo
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Build site
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: hugo --minify --baseURL "${BASE_URL}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v5
        id: deployment
